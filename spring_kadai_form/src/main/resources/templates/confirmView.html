<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>入力内容のご確認</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
	<!--タイトル-->
	<h1>入力内容をご確認ください</h1>

	<!--以下入力した内容をテーブル状に表示-->
	<table border="1">

		<!--見出し行 (一番上の行)-->
		<tr>
			<th>項目</th>
			<th>入力内容</th>
		</tr>

		<!--２行目 お名前-->
		<tr>
			<td>お名前</td>
			<td th:text=${contactForm.name}></td>
		</tr>

		<!--３行目 メールアドレス-->
		<tr>
			<td>メールアドレス</td>
			<td th:text="*{contactForm.email}"></td>
		</tr>
		
		<!--４行目 お問い合わせ内容-->
		<tr>
			<td>お問い合わせ内容</td>
			<td th:text="*{contactForm.message}"></td>
		</tr>

	</table>


</body>

</html>
